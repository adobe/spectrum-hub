<!DOCTYPE html>
<html lang="en" class="spectrum-edge">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple playground interactions</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/blocks/playground/playground.css">
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <main id="main-content">
    <div class="section">
      <div class="playground">
        <div><div>implementation</div><div>swc</div></div>
        <div><div>component</div><div>button</div></div>
      </div>
      <div class="playground">
        <div><div>implementation</div><div>swc</div></div>
        <div><div>component</div><div>badge</div></div>
      </div>
    </div>
  </main>
  <script type="module">
    import init from '/blocks/playground/playground.js';
    await Promise.all([...document.querySelectorAll('.playground')].map(init));
  </script>
</body>
</html>
