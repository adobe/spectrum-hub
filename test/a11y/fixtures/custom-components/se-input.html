<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>se-input fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- se.js imports the bare "lit" specifier -->
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <div class="test-container">
    <se-input label="Name" name="name" placeholder="Jane Doe"></se-input>
    <se-input type="search" label="Search" name="search" value="spectrum"></se-input>
    <se-input label="Email" name="email" error="Enter a valid email address"></se-input>
  </div>
  <script type="module">
    import '/deps/se/se.js';
  </script>
</body>
</html>
