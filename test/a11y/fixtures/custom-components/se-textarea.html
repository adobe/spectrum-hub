<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>se-textarea fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- se.js imports the bare "lit" specifier -->
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <div class="test-container">
    <se-textarea label="Notes" name="notes" placeholder="Add notes" rows="4" cols="40"></se-textarea>
    <se-textarea label="Bio" name="bio" error="This field is required"></se-textarea>
  </div>
  <script type="module">
    import '/deps/se/se.js';
  </script>
</body>
</html>
