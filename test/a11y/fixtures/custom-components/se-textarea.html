<!DOCTYPE html>
<html lang="en" class="spectrum-edge">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>se-textarea fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- se.js imports the bare "lit" specifier -->
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <main class="test-container">
    <se-textarea label="Notes" name="notes" placeholder="Add notes" rows="4" cols="40"></se-textarea>
    <se-textarea label="Bio" name="bio" error="This field is required"></se-textarea>
    <se-textarea label="Summary" name="summary" value="A populated summary."></se-textarea>
    <se-textarea label="Side label" labelPosition="side" name="side-label" value="Side notes"></se-textarea>
    <se-textarea label="Hidden label" hide-label name="hidden-label" value="Hidden label notes"></se-textarea>
    <se-textarea class="quiet" label="Quiet notes" name="quiet" value="Quiet text"></se-textarea>
    <se-textarea class="monospace" label="Code" name="code" value="const count = 3;"></se-textarea>
  </main>
  <script type="module">
    import '/deps/se/se.js';
  </script>
</body>
</html>
