<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>se-checkbox fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- se.js imports the bare "lit" specifier -->
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <div class="test-container">
    <se-checkbox name="terms">I agree to the terms</se-checkbox>
    <se-checkbox name="newsletter" checked>Subscribe to the newsletter</se-checkbox>
    <se-checkbox name="required-field" error="This field is required">Required checkbox</se-checkbox>
  </div>
  <script type="module">
    import '/deps/se/se.js';
  </script>
</body>
</html>
