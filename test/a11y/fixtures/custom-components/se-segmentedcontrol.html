<!DOCTYPE html>
<html lang="en" class="spectrum-edge">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>se-segmentedcontrol fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- se.js imports the bare "lit" specifier -->
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <main class="test-container">
    <se-segmentedcontrol label="View" labelPosition="side">
      <fieldset>
        <label>
          <input type="radio" name="view" value="map" checked>
          <span>Map</span>
        </label>
        <label>
          <input type="radio" name="view" value="list">
          <span>List</span>
        </label>
        <label>
          <input type="radio" name="view" value="grid">
          <span>Grid</span>
        </label>
      </fieldset>
    </se-segmentedcontrol>
  </main>
  <script type="module">
    import '/deps/se/se.js';
  </script>
</body>
</html>
