<!DOCTYPE html>
<html lang="en" class="spectrum-edge">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>se-button fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- se.js imports the bare "lit" specifier -->
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <main class="test-container">
    <se-button>Save</se-button>
    <se-button class="secondary">Cancel</se-button>
    <se-button class="primary">Continue</se-button>
    <se-button disabled>Delete</se-button>
    <se-button class="negative">Remove</se-button>
    <se-button class="primary outline">Preview</se-button>
    <se-button class="secondary outline">Go back</se-button>
    <se-button class="icon-only"><span class="visually-hidden">Add item</span><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="2"></path></svg></se-button>
    <se-button class="text-size-xl">Get started</se-button>
  </main>
  <script type="module">
    import '/deps/se/se.js';
  </script>
</body>
</html>
