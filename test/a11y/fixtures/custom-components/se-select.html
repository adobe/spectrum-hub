<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>se-select fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- se.js imports the bare "lit" specifier -->
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <div class="test-container">
    <se-select label="Size" name="size">
      <option value="s">Small</option>
      <option value="m">Medium</option>
      <option value="l">Large</option>
    </se-select>
    <se-select label="Disabled picker" name="disabled-picker" disabled>
      <option value="s">Small</option>
    </se-select>
  </div>
  <script type="module">
    import '/deps/se/se.js';
  </script>
</body>
</html>
