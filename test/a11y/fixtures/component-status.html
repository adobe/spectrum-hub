<!DOCTYPE html>
<html lang="en" class="spectrum-edge">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component-status block fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/blocks/component-status/component-status.css">
</head>
<body>
  <main id="main-content">
    <div class="section">
      <div class="component-status"></div>
    </div>
  </main>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const platform = params.get('platform');
    const root = ['ios', 'android'].includes(platform) ? `/mobile/${platform}` : '/web/swc';
    const component = params.get('component') || 'button';
    history.pushState({}, '', `${root}/components/${component}`);
    import init from '/blocks/component-status/component-status.js';
    document.querySelectorAll('.component-status').forEach(init);
  </script>
</body>
</html>
