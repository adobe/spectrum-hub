<!DOCTYPE html>
<html lang="en" class="spectrum-edge">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component-status block fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/blocks/component-status/component-status.css">
  <link rel="stylesheet" href="/blocks/page-nav/page-nav.css">
  <link rel="stylesheet" href="/blocks/page-hero/page-hero.css">
</head>
<body>
  <main id="main-content">
    <div class="section">
      <div class="component-status"></div>
    </div>
  </main>
  <template id="authored-status">
    <div class="component-status">
      <div>
        <div><p><a href="https://www.figma.com/design/OQExiy8bX0pRqee71eAWX6/S2---iOS?node-id=2595-2573">iOS Figma: Menu</a></p></div>
        <div><a href="https://github.com/OneAdobe/spectrum-ios/tree/main/Sources/SpectrumComponents/Menu">iOS GitHub repo: Menu</a></div>
        <div>Android Code not available</div>
        <div>Android Design Not available</div>
      </div>
    </div>
  </template>
  <script type="module">
    import { setConfig } from '/scripts/ak.js';
    import init from '/blocks/component-status/component-status.js';

    const params = new URLSearchParams(location.search);
    const platform = params.get('platform');
    const root = platform === 'mobile' ? '/mobile'
      : ['ios', 'android'].includes(platform) ? `/mobile/${platform}` : '/web/swc';
    const component = params.get('component') || 'button';
    if (params.has('authored')) {
      document.querySelector('.section').replaceChildren(
        document.querySelector('#authored-status').content.cloneNode(true),
      );
    } else {
      history.pushState({}, '', `${root}/components/${component}`);
    }
    if (params.has('nav')) {
      const heading = document.createElement('h1');
      heading.textContent = 'Authored pattern';
      document.querySelector('.section').prepend(heading);
      setConfig({ components: [], cdnEnv: false });
      history.replaceState({}, '', '/patterns/conversational-ai/authored');
    }
    if (params.has('nav-first')) {
      await import('/blocks/page-nav/page-nav.js');
    }
    if (params.has('hero')) {
      const meta = document.createElement('meta');
      meta.name = 'template';
      meta.content = 'component';
      document.head.append(meta);
      const hero = document.createElement('div');
      hero.className = 'page-hero';
      const heading = document.createElement('h1');
      heading.textContent = 'Menu';
      hero.append(heading);
      document.querySelector('.section').prepend(hero);
      setConfig({ components: [], cdnEnv: false });
      const { default: initHero } = await import('/blocks/page-hero/page-hero.js');
      initHero(hero);
    }
    await Promise.all([...document.querySelectorAll('.component-status')].map(init));
    if (params.has('nav') && !params.has('nav-first')) {
      await import('/blocks/page-nav/page-nav.js');
    }
  </script>
</body>
</html>
