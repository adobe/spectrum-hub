<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home template fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/templates/home/home.css">
</head>
<body class="home-template">
  <header class="header">
    <a class="skip-link visually-hidden" href="#main-content">Skip to main content</a>
  </header>
  <main id="main-content">
    <!--
      home.js reads: h1 → heading.closest('div') → parent.nextElementSibling
      The h1 must have a div parent that has a following sibling div.
    -->
    <div class="section">
      <div>
        <h1>Author Kit</h1>
        <p>Powerfully simple experiences for Edge Delivery Services.</p>
      </div>
      <div>
        <h2>Get started</h2>
        <p>Explore the component library and start building accessible sites.</p>
      </div>
    </div>
  </main>
  <footer>
    <p>© 2026 Adobe. All rights reserved.</p>
  </footer>
  <script type="module">
    import init from '/templates/home/home.js';
    init();
  </script>
</body>
</html>
