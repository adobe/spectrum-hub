<!DOCTYPE html>
<html lang="en" class="spectrum-edge">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search block fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- search.js imports deps/se/se.js, which imports the bare "lit" specifier -->
  <script type="importmap">
    { "imports": { "lit": "/deps/lit/dist/index.js" } }
  </script>
</head>
<body>
  <main id="main-content">
    <div class="section">
      <div class="search"></div>
    </div>
  </main>
  <script type="module">
    import init from '/blocks/search/search.js';
    document.querySelectorAll('.search').forEach(init);
  </script>
</body>
</html>
