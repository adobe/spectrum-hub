<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card block fixture</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/blocks/card/card.css">
</head>
<body>
  <main id="main-content">
    <!-- styles.css hides any bare `main > div` until decorated (`display: none`);
         .section is the specific override back to `display: block`. Without this
         wrapper .card never becomes visible, no matter its content. -->
    <div class="section">
      <div class="card">
        <!-- each row needs a cell-level <div> — card.js's :scope > div cell lookup
             expects one, not raw content directly inside the row -->
        <div>
          <div>
            <picture>
              <img
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                alt="A scenic landscape photo"
                width="180"
                height="120"
              >
            </picture>
          </div>
        </div>
        <div>
          <div>
            <h3>Card heading</h3>
            <p>Concise supporting text that gives context for the card action.</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script type="module">
    import init from '/blocks/card/card.js';
    document.querySelectorAll('.card').forEach(init);
  </script>
</body>
</html>
