name: Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Each suite reports as its own check leg, so a failure names the culprit
    # instead of hiding behind one aggregated exit code. fail-fast: false keeps
    # every leg running even when one fails.
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, extractions, indexer, 'links:unit']
    name: test (${{ matrix.suite }})
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:${{ matrix.suite }}
