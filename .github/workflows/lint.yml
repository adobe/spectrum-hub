name: Lint

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Register ESLint problem matcher
        run: echo "::add-matcher::.github/matchers/eslint-stylish.json"

      - name: Run ESLint
        run: npx eslint .

      # Stylelint 17 removed the built-in --formatter=github (see stylelint/stylelint#7447).
      # Unix formatter lines match .github/matchers/stylelint-unix.json for PR annotations.
      - name: Register Stylelint problem matcher
        if: always()
        run: echo "::add-matcher::.github/matchers/stylelint-unix.json"

      - name: Run Stylelint
        if: always()
        run: npx stylelint "blocks/**/*.css" "styles/*.css" --formatter=unix
