name: Validate Figma discovery

on:
  schedule:
    - cron: '15 8 * * *' # Daily at 08:15 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Figma validation must run from the default branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test Figma discovery and resolution
        run: node --test test/extractions/figma-*.node.test.js test/extractions/build-status-index.node.test.js

      - name: Discover published Figma component sets
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node deps/figma/discover-components.js

      - name: Rebuild the combined status index
        run: node deps/build-status-index.js

      - name: Report generated changes
        run: |
          git diff --stat -- deps/figma/components.json deps/status-index.json deps/status deps/impl-component-names.js
          git status --short -- deps/figma/components.json deps/status-index.json deps/status deps/impl-component-names.js
