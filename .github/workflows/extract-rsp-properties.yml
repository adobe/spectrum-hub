name: Update React Spectrum Component Properties

on:
  schedule:
    - cron: '0 7 * * *' # Daily at 7am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-properties:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # extract-props.js resolves types through the real `typescript` compiler
      # (deps/rsp/ts-cdn-host.js), so this step is required — it wasn't before.
      - name: Install dependencies
        run: npm ci

      - name: Discover published S2 components
        run: node deps/rsp/discover-components.js

      - name: Extract component properties
        run: node deps/rsp/extract-props.js

      # Rebuilds the combined index from the freshly-extracted RSP data plus the
      # currently-committed SWC data. Fails closed on an empty roster.
      - name: Build combined status index
        run: node deps/build-status-index.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deps/rsp/components.json deps/rsp/data/ deps/status-index.json deps/status/ deps/impl-aliases.js deps/rsp-export-names.js
          git diff --staged --quiet || git commit -m "chore: update React Spectrum component properties and status index"
          git push
