<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Artifact</title>
  <link rel="stylesheet" href="/deps/swc/bundled/swc.css" />
  <script type="module" src="./shared/theme-sync.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
      color-scheme: light dark;
      background: light-dark(#fff, #000);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 100vh;
    }

    #mount {
      display: contents;
    }
  </style>
</head>
<body>
  <div id="mount"></div>

  <script type="module">
    import { listenForPropUpdates } from './shared/prop-listener.js';

    // Served from deps/swc/bundled which is generated by scripts/build-swc-components.js.
    // When @adobe/spectrum-wc publishes ESM entry points to a CDN, swap this
    // import for that URL.
    try {
      await import('/deps/swc/bundled/swc-upload-artifact.js');
    } catch {
      document.body.textContent = 'Failed to load SWC component: swc-upload-artifact';
      throw new Error('SWC import failed for swc-upload-artifact');
    }

    const el = document.createElement('swc-upload-artifact');
    el.setAttribute('dismissible', '');
    el.textContent = 'design-mockup.png';
    document.getElementById('mount').appendChild(el);

    listenForPropUpdates(({ property, attribute, value }) => {
      if (property === 'text' || property === 'label' || property === 'children') {
        el.textContent = value;
        return;
      }

      if (attribute) {
        if (value === false || value === null || value === undefined) {
          el.removeAttribute(attribute);
        } else if (value === true) {
          el.setAttribute(attribute, '');
        } else {
          el.setAttribute(attribute, value);
        }
      }
    });
  </script>
</body>
</html>
