<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar</title>
  <link rel="stylesheet" href="/deps/swc/bundled/swc.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
      background: transparent;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 100vh;
    }

    #mount {
      display: contents;
    }
  </style>
</head>
<body>
  <div id="mount"></div>

  <script type="module">
    import { listenForPropUpdates } from './shared/prop-listener.js';

    // Served from deps/swc/bundled which is generated by scripts/build-swc-components.js.
    // When @adobe/spectrum-wc publishes ESM entry points to a CDN, swap this
    // import for that URL.
    try {
      await import('/deps/swc/bundled/swc-avatar.js');
    } catch {
      document.body.textContent = 'Failed to load SWC component: swc-avatar';
      throw new Error('SWC import failed for swc-avatar');
    }

    const el = document.createElement('swc-avatar');

    // Avatar renders <img src="...">, so a real src is required for a non-broken preview.
    const placeholder = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#8a8a8a"/><text x="32" y="41" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">AB</text></svg>';
    el.src = `data:image/svg+xml;utf8,${encodeURIComponent(placeholder)}`;
    el.setAttribute('alt', 'User avatar');
    document.getElementById('mount').appendChild(el);

    listenForPropUpdates(({ property, attribute, value }) => {
      if (property === 'text' || property === 'label' || property === 'children') {
        el.textContent = value;
        return;
      }

      if (attribute) {
        if (value === false || value === null || value === undefined) {
          el.removeAttribute(attribute);
        } else if (value === true) {
          el.setAttribute(attribute, '');
        } else {
          el.setAttribute(attribute, value);
        }
      }
    });
  </script>
</body>
</html>
