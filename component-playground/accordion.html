<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accordion</title>
  <link rel="stylesheet" href="/deps/swc/bundled/swc.css" />
  <script type="module" src="./shared/theme-sync.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
      color-scheme: light dark;
      background: light-dark(#fff, #000);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 100vh;
    }

    #mount {
      display: contents;
    }
  </style>
</head>
<body>
  <div id="mount"></div>

  <script type="module">
    import { listenForPropUpdates } from './shared/prop-listener.js';

    // Served from deps/swc/bundled which is generated by scripts/build-swc-components.js.
    // When @adobe/spectrum-wc publishes ESM entry points to a CDN, swap this
    // import for that URL.
    try {
      await import('/deps/swc/bundled/swc-accordion.js');
    } catch {
      document.body.textContent = 'Failed to load SWC component: swc-accordion';
      throw new Error('SWC import failed for swc-accordion');
    }

    try {
      await import('/deps/swc/bundled/swc-accordion-item.js');
    } catch {
      // Accordion items are bundled separately; the accordion shell still renders without them.
    }

    const el = document.createElement('swc-accordion');

    const item1 = document.createElement('swc-accordion-item');
    item1.setAttribute('open', '');
    const label1 = document.createElement('span');
    label1.slot = 'label';
    label1.textContent = 'Section one';
    item1.appendChild(label1);
    item1.append('Content for section one.');

    const item2 = document.createElement('swc-accordion-item');
    const label2 = document.createElement('span');
    label2.slot = 'label';
    label2.textContent = 'Section two';
    item2.appendChild(label2);
    item2.append('Content for section two.');

    el.append(item1, item2);
    document.getElementById('mount').appendChild(el);

    listenForPropUpdates(({ property, attribute, value }) => {
      if (property === 'text' || property === 'label' || property === 'children') {
        el.textContent = value;
        return;
      }

      if (attribute) {
        if (value === false || value === null || value === undefined) {
          el.removeAttribute(attribute);
        } else if (value === true) {
          el.setAttribute(attribute, '');
        } else {
          el.setAttribute(attribute, value);
        }
      }
    });
  </script>
</body>
</html>
