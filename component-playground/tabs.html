<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabs</title>
  <link rel="stylesheet" href="/deps/swc/bundled/swc.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
      background: transparent;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 100vh;
    }

    #mount {
      display: contents;
    }
  </style>
</head>
<body>
  <div id="mount"></div>

  <script type="module">
    import { listenForPropUpdates } from './shared/prop-listener.js';

    // Served from deps/swc/bundled which is generated by scripts/build-swc-components.js.
    // When @adobe/spectrum-wc publishes ESM entry points to a CDN, swap this
    // import for that URL.
    try {
      await import('/deps/swc/bundled/swc-tabs.js');
    } catch {
      document.body.textContent = 'Failed to load SWC component: swc-tabs';
      throw new Error('SWC import failed for swc-tabs');
    }

    try {
      await Promise.all([
        import('/deps/swc/bundled/swc-tab.js'),
        import('/deps/swc/bundled/swc-tab-panel.js'),
      ]);
    } catch {
      // Tabs and panels are bundled separately; the tablist shell still renders without them.
    }

    const el = document.createElement('swc-tabs');
    el.setAttribute('selected', 'overview');

    const tab1 = document.createElement('swc-tab');
    tab1.setAttribute('tab-id', 'overview');
    tab1.textContent = 'Overview';

    const tab2 = document.createElement('swc-tab');
    tab2.setAttribute('tab-id', 'details');
    tab2.textContent = 'Details';

    const panel1 = document.createElement('swc-tab-panel');
    panel1.setAttribute('tab-id', 'overview');
    panel1.setAttribute('selected', '');
    panel1.textContent = 'Overview panel content.';

    const panel2 = document.createElement('swc-tab-panel');
    panel2.setAttribute('tab-id', 'details');
    panel2.textContent = 'Details panel content.';

    el.append(tab1, tab2, panel1, panel2);
    document.getElementById('mount').appendChild(el);

    listenForPropUpdates(({ property, attribute, value }) => {
      if (property === 'text' || property === 'label' || property === 'children') {
        el.textContent = value;
        return;
      }

      if (attribute) {
        if (value === false || value === null || value === undefined) {
          el.removeAttribute(attribute);
        } else if (value === true) {
          el.setAttribute(attribute, '');
        } else {
          el.setAttribute(attribute, value);
        }
      }
    });
  </script>
</body>
</html>
