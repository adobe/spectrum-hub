<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Icon</title>
  <link rel="stylesheet" href="/deps/swc/bundled/swc.css" />
  <script type="module" src="./shared/theme-sync.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
      color-scheme: light dark;
      background: light-dark(#fff, #000);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 100vh;
    }

    #mount {
      display: contents;
    }
  </style>
</head>
<body>
  <div id="mount"></div>

  <script type="module">
    import { listenForPropUpdates } from './shared/prop-listener.js';

    // Served from deps/swc/bundled which is generated by scripts/build-swc-components.js.
    // When @adobe/spectrum-wc publishes ESM entry points to a CDN, swap this
    // import for that URL.
    try {
      await import('/deps/swc/bundled/swc-icon.js');
    } catch {
      document.body.textContent = 'Failed to load SWC component: swc-icon';
      throw new Error('SWC import failed for swc-icon');
    }

    const el = document.createElement('swc-icon');
    el.setAttribute('label', 'Search');
    // swc-icon is a minimal renderer for slotted SVG markup.
    el.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M14.5 13.09 11.41 10a6 6 0 1 0-1.41 1.41l3.09 3.09a1 1 0 0 0 1.41-1.41zM3 7a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg>';
    document.getElementById('mount').appendChild(el);

    listenForPropUpdates(({ property, attribute, value }) => {
      if (property === 'text' || property === 'label' || property === 'children') {
        el.textContent = value;
        return;
      }

      if (attribute) {
        if (value === false || value === null || value === undefined) {
          el.removeAttribute(attribute);
        } else if (value === true) {
          el.setAttribute(attribute, '');
        } else {
          el.setAttribute(attribute, value);
        }
      }
    });
  </script>
</body>
</html>
